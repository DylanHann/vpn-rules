# 人人远程分流规则草稿 — 2026-10-02
# Clash rules 格式；人人远程导入兼容性尚未验证。
# PROXY 必须对应客户端实际的代理策略组。
# 按域名分流；不是所有国外域名的完整清单。
# 不包含节点、订阅地址或账号信息。
rules:
